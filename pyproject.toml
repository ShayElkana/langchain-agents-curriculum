[project]
name = "agents-test1"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.20",
    "langchain>=1.4.2",
    "langchain-openai>=1.6.5",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
